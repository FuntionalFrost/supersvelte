<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --bg: #090d16;
      --fg: #ffffff;
      --accent: #34d399;
      --border: rgba(255, 255, 255, 0.15);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --accent: #059669;
        --border: #cbd5e1;
      }
