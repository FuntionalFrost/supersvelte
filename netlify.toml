# netlify.toml
[build]
  command = "pnpm build"
  publish = "build"

[build.environment]
  NODE_VERSION = "26"
  PNPM_VERSION = "11.24.0"
  SECRETS_SCAN_OMIT_KEYS = "ORIGIN, POLAR_ENVIRONMENT, PUBLIC_POLAR_STANDARD_PRODUCT_ID, PUBLIC_POLAR_PRO_PRODUCT_ID"

# Security Headers (Adapter does not add these automatically)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
