# netlify.toml
[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "24.19.0"

# Security Headers (Adapter does not add these automatically)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"