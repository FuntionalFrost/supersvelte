name: 🐛 Bug Report
description: File a bug report to help us improve SuperSvelte
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues before submitting to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps or a minimal repository/playground link to reproduce the behavior.
      placeholder: |
        1. Clone repository
        2. Run 'pnpm install'
        3. Start dev server 'pnpm dev'
        4. Navigate to '...'
        5. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or terminal logs to help explain your problem.
  - type: dropdown
    id: environment
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux / WSL
        - Windows
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node & pnpm Versions
      placeholder: 'Node v22.x, pnpm v10.x'
    validations:
      required: false
