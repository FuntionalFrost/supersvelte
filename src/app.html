<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link id="favicon" rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#ff3e00" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('yaxa-theme');
					var isDark =
						stored === 'dark' ||
						((!stored || stored === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (isDark) {
						document.documentElement.classList.add('dark');
						document.documentElement.style.colorScheme = 'dark';
					} else {
						document.documentElement.classList.remove('dark');
						document.documentElement.style.colorScheme = 'light';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
